name: Deploy StudyMatch call function

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/create-daily-room/**'
      - 'supabase/config.toml'
      - '.github/workflows/deploy-supabase-function.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Deploy create-daily-room
        run: npx supabase functions deploy create-daily-room --project-ref puqnwypfdbzqxykamrvj
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
